<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; padding: 50px; background: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; font-size: 1.2em; text-align: center; color: #28a745; min-height: 1.5em; }
    </style>
</head>
<body>

<div class="card">
    <h2>Housing Predictor</h2>
    
    <div class="input-group">
        <label for="input1">Median Income (in $10k)</label>
        <input type="number" id="input1" step="0.1" placeholder="e.g. 3.5">
    </div>

    <div class="input-group">
        <label for="input2">House Age</label>
        <input type="number" id="input2" placeholder="e.g. 25">
    </div>

    <div class="input-group">
        <label for="input3">Average Rooms</label>
        <input type="number" id="input3" step="0.1" placeholder="e.g. 5.2">
    </div>

    <button onclick="predict()">Calculate Price</button>
    
    <div id="result"></div>
</div>

<script>
    function predict() {
        const x1 = parseFloat(document.getElementById('input1').value) || 0;
        const x2 = parseFloat(document.getElementById('input2').value) || 0;
        const x3 = parseFloat(document.getElementById('input3').value) || 0;

        // PASTE YOUR NUMBERS BELOW
        const weights = [-0.42665982246398926, -0.4126211404800415, 0.36722683906555176]; 
        const bias = -0.5763885378837585;

        // The calculation
        const rawPrediction = (x1 * weights[0]) + (x2 * weights[1]) + (x3 * weights[2]) + bias;

        // Formatting for the display
        const finalPrice = rawPrediction * 100000; 

        if (isNaN(finalPrice)) {
            document.getElementById('result').innerText = "Please enter valid numbers.";
        } else {
            document.getElementById('result').innerText = "Estimated Value: $" + finalPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    }
</script>

</body>
</html>
