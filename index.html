<!DOCTYPE html>
<html>
<head>
    <title>California Housing Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <h2>Housing Value Predictor</h2>
    <input type="number" id="income" placeholder="Med Income (e.g. 3.5)" step="0.1">
    <input type="number" id="age" placeholder="House Age (e.g. 20)">
    <input type="number" id="rooms" placeholder="Avg Rooms (e.g. 5)">
    <button onclick="predict()">Predict</button>
    <p id="result">Result will appear here...</p>

    <script>
        async function predict() {
            try {
                // 1. Load the model from the same folder
                const session = await ort.InferenceSession.create('./final_model.onnx');

                // 2. Get raw values
                const income = parseFloat(document.getElementById('income').value);
                const age = parseFloat(document.getElementById('age').value);
                const rooms = parseFloat(document.getElementById('rooms').value);

                // 3. SCALE THE DATA (Manual StandardScaler math)
                // These constants match the California Housing Dataset averages/std
                const s_income = (income - 3.87) / 1.90;
                const s_age = (age - 28.64) / 12.59;
                const s_rooms = (rooms - 5.43) / 2.47;

                // 4. Prepare Tensor
                const inputData = new Float32Array([s_income, s_age, s_rooms]);
                const tensor = new ort.Tensor('float32', inputData, [1, 3]);

                // 5. Run Inference (matching names 'input' and 'output')
                const feeds = { input: tensor };
                const results = await session.run(feeds);
                const output = results.output.data[0];

                document.getElementById('result').innerText = "Predicted Price: $" + (output * 100000).toFixed(2);
            } catch (e) {
                console.error(e);
                document.getElementById('result').innerText = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
