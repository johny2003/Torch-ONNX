<!DOCTYPE html>
<html>
<head>
    <title>House Price Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <h3>California House Price Regression</h3>
    <input type="number" id="income" placeholder="Median Income">
    <input type="number" id="age" placeholder="House Age">
    <input type="number" id="rooms" placeholder="Avg Rooms">
    <button onclick="predict()">Predict</button>
    <p id="result">Result: </p>

    <script>
        async function predict() {
            const session = await ort.InferenceSession.create('./model.onnx');
            
            // Get inputs from HTML
            const dims = [1, 3];
            const data = Float32Array.from([
                document.getElementById('income').value,
                document.getElementById('age').value,
                document.getElementById('rooms').value
            ]);

            const tensor = new ort.Tensor('float32', data, dims);
            const feeds = { input: tensor };
            const results = await session.run(feeds);
            
            document.getElementById('result').innerText = 
                "Predicted Value: $" + (results.output.data[0] * 100000).toFixed(2);
        }
    </script>
</body>
</html>
